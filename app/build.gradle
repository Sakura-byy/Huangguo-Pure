plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.huangguo.pure'
    compileSdk 36

    defaultConfig {
        applicationId 'com.huangguo.pure'
        minSdk 24
        targetSdk 36
        versionCode 21
        versionName '1.2.0'
        resConfigs 'zh', 'en'
        // 只打 64 位：省掉 armeabi-v7a / x86 / x86_64 三套原生库与对齐填充
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            // 签名信息放本地 gradle.properties（不随仓库分发）：
            // HG_STORE_FILE / HG_STORE_PASS / HG_KEY_ALIAS / HG_KEY_PASS
            if (project.hasProperty('HG_STORE_FILE')) {
                storeFile file(HG_STORE_FILE)
                storePassword HG_STORE_PASS
                keyAlias HG_KEY_ALIAS
                keyPassword HG_KEY_PASS
            }
        }
    }

    buildTypes {
        release {
            // R8 压缩 + 资源裁剪：不影响功能，显著减小 APK 体积
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        // 关闭 BuildConfig：本工程不读 BuildConfig 字段，少生成一个类
        buildConfig false
    }

    // 不往 APK 里塞依赖清单（Google Play 用的元数据），省 dex 与资源
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        // release 不生成 lint 中间产物
        checkDependencies false
    }

    packagingOptions {
        resources {
            // 许可证 / 声明类纯文本对运行零作用，压缩后也有几十 KB
            excludes += [
                    'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                    'META-INF/*.version',
                    'META-INF/*.md',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/DEPENDENCIES',
                    'META-INF/**/LICENSE*',
                    'META-INF/**/*.version',
                    'DebugProbesKt.bin'
            ]
        }
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    // media3-ui 未使用（播放控件全部自绘），去掉省一份 dex

    // 液态玻璃：Kyant0 Backdrop（Compose Multiplatform 制品，Android 变体映射到 androidx.compose）
    implementation 'io.github.kyant0:backdrop:1.0.6'
    implementation 'io.github.kyant0:shapes:1.2.0'
    implementation 'androidx.compose.ui:ui:1.10.3'
    implementation 'androidx.compose.foundation:foundation:1.10.3'
    implementation 'androidx.compose.runtime:runtime:1.10.3'
}
