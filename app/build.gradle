plugins {
    id 'com.android.application'
}

android {
    namespace 'com.huangguo.pure'
    compileSdk 34

    defaultConfig {
        applicationId 'com.huangguo.pure'
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName '1.0.0'
        resConfigs 'zh', 'en'
    }

    signingConfigs {
        release {
            // 签名信息放本地 gradle.properties（不随仓库分发）：
            // HG_STORE_FILE / HG_STORE_PASS / HG_KEY_ALIAS / HG_KEY_PASS
            if (project.hasProperty('HG_STORE_FILE')) {
                storeFile file(HG_STORE_FILE)
                storePassword HG_STORE_PASS
                keyAlias HG_KEY_ALIAS
                keyPassword HG_KEY_PASS
            }
        }
    }

    buildTypes {
        release {
            // R8 压缩 + 资源裁剪：不影响功能，显著减小 APK 体积
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
